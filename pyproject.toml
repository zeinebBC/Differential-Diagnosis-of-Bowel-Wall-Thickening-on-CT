[project]
name = "ColonCancerDetection"
version = "1.0.0"
requires-python = ">=3.10"
description = " ColonCancer Classifier + nnU-Net segmentator."
readme = "README.md"

authors = [
    { name = ""},
    { name = "" }
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    'deep learning',
    'image segmentation',
    'semantic segmentation',
    'medical image analysis',
    'medical image segmentation',
    'nnU-Net',
    'nnunet'
]

dependencies = [
    "mlflow>=3.4.0",
    #"torch>=2.1.2,<2.6",  # keep max compatible with your list
    #"torchvision>=0.20.1,<0.21",
    "torchio==0.20.23",
    "torchmetrics==1.8.2",
    "pytorch_lightning==2.5.5",
    "monai==1.5.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn==1.7.2",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.5.2",
    "nibabel",
    "blosc2>=3.11.0",
    "batchgenerators>=0.25.1",
    "batchgeneratorsv2>=0.3.0",
    "dynamic-network-architectures>=0.4.1,<0.5",
    "acvl-utils>=0.2.3,<0.3",
    "tqdm",
    "scipy",
    "graphviz",
    "tifffile",
    "requests",
    "matplotlib",
    "seaborn",
    "imagecodecs",
    "yacs",
    "einops",
    "TotalSegmentator"
]

[tool.setuptools]
py-modules = ["run_totalseg"]

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
homepage = ""
repository = ""

[project.scripts]
segment_colon = "run_totalseg:main"
train_resnet = "classifier.scripts.main_train:main"
predict_resnet = "classifier.scripts.main_inference:main"
nnUNetv2_plan_and_preprocess = "segmentator.nnunetv2_custom.experiment_planning.plan_and_preprocess_entrypoints:plan_and_preprocess_entry"
nnUNetv2_extract_fingerprint = "segmentator.nnunetv2_custom.experiment_planning.plan_and_preprocess_entrypoints:extract_fingerprint_entry"
nnUNetv2_plan_experiment = "segmentator.nnunetv2_custom.experiment_planning.plan_and_preprocess_entrypoints:plan_experiment_entry"
nnUNetv2_preprocess = "segmentator.nnunetv2_custom.experiment_planning.plan_and_preprocess_entrypoints:preprocess_entry"
nnUNetv2_train = "segmentator.nnunetv2_custom.run.run_training:run_training_entry"
nnUNetv2_predict_from_modelfolder = "segmentator.nnunetv2_custom.inference.predict_from_raw_data:predict_entry_point_modelfolder"
nnUNetv2_predict = "segmentator.nnunetv2_custom.inference.predict_from_raw_data:predict_entry_point"
nnUNetv2_convert_old_nnUNet_dataset = "segmentator.nnunetv2_custom.dataset_conversion.convert_raw_dataset_from_old_nnunet_format:convert_entry_point"
nnUNetv2_find_best_configuration = "segmentator.nnunetv2_custom.evaluation.find_best_configuration:find_best_configuration_entry_point"
nnUNetv2_determine_postprocessing = "segmentator.nnunetv2_custom.postprocessing.remove_connected_components:entry_point_determine_postprocessing_folder"
nnUNetv2_apply_postprocessing = "segmentator.nnunetv2_custom.postprocessing.remove_connected_components:entry_point_apply_postprocessing"
nnUNetv2_ensemble = "segmentator.nnunetv2_custom.ensembling.ensemble:entry_point_ensemble_folders"
nnUNetv2_accumulate_crossval_results = "segmentator.nnunetv2_custom.evaluation.find_best_configuration:accumulate_crossval_results_entry_point"
nnUNetv2_plot_overlay_pngs = "segmentator.nnunetv2_custom.utilities.overlay_plots:entry_point_generate_overlay"
nnUNetv2_download_pretrained_model_by_url = "segmentator.nnunetv2_custom.model_sharing.entry_points:download_by_url"
nnUNetv2_install_pretrained_model_from_zip = "segmentator.nnunetv2_custom.model_sharing.entry_points:install_from_zip_entry_point"
nnUNetv2_export_model_to_zip = "segmentator.nnunetv2_custom.model_sharing.entry_points:export_pretrained_model_entry"
nnUNetv2_move_plans_between_datasets = "segmentator.nnunetv2_custom.experiment_planning.plans_for_pretraining.move_plans_between_datasets:entry_point_move_plans_between_datasets"
nnUNetv2_evaluate_folder = "segmentator.nnunetv2_custom.evaluation.evaluate_predictions:evaluate_folder_entry_point"
nnUNetv2_evaluate_simple = "segmentator.nnunetv2_custom.evaluation.evaluate_predictions:evaluate_simple_entry_point"
nnUNetv2_convert_MSD_dataset = "segmentator.nnunetv2_custom.dataset_conversion.convert_MSD_dataset:entry_point"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pre-commit"
]

[tool.ruff]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=67.8.0"]
build-backend = "setuptools.build_meta"

[tool.codespell]
skip = '.git,*.pdf,*.svg'
#
# ignore-words-list = ''
